// Isolated emulator acceptance only: never use this ABI/signature build as an upgrade APK.
allprojects { p ->
    p.plugins.withId('com.android.application') {
        // Run after the app DSL has added its release ARM64 filter.
        p.androidComponents.finalizeDsl { android ->
            android.defaultConfig.ndk.abiFilters.clear()
            android.defaultConfig.ndk.abiFilters.add('x86_64')
            android.defaultConfig.testInstrumentationRunner = 'dev.streampocket.UiAcceptanceInstrumentation'
            android.sourceSets.androidTest.assets.srcDir(p.rootProject.file('test-media'))
        }
    }
}
