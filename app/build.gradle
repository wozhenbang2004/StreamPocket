plugins { id 'com.android.application' }

def previewInstall = providers.gradleProperty('previewInstall').orNull == 'true'
def previewVersionCode = providers.gradleProperty('previewVersionCode').orNull
def previewVersionName = providers.gradleProperty('previewVersionName').orNull
def previewUpdateChannel = providers.gradleProperty('previewUpdateChannel').orNull ?: ''
def previewKeystore = providers.gradleProperty('previewKeystore').orNull
def previewStorePassword = providers.gradleProperty('previewStorePassword').orNull
def previewKeyAlias = providers.gradleProperty('previewKeyAlias').orNull
def previewKeyPassword = providers.gradleProperty('previewKeyPassword').orNull
def escapedPreviewChannel = previewUpdateChannel.replace('\\', '\\\\').replace('"', '\\"')

android {
    signingConfigs {
        preview {
            if (previewKeystore != null) {
                storeFile file(previewKeystore)
                storePassword previewStorePassword
                keyAlias previewKeyAlias
                keyPassword previewKeyPassword
            }
        }
    }
    namespace 'dev.streampocket'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        // Preserve the installed lineage for signed overwrite updates.
        applicationId 'dev.streampocket.localtest'
        minSdk 24
        targetSdk 35
        versionCode previewVersionCode != null ? previewVersionCode.toInteger() : 33
        versionName previewVersionName != null ? previewVersionName : '0.6.0'
        buildConfigField 'String', 'PREVIEW_UPDATE_CHANNEL', '"' + escapedPreviewChannel + '"'
        manifestPlaceholders = [appLabel: '拾流']
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildFeatures { buildConfig true }
    testOptions { unitTests { includeAndroidResources = true } }
    buildTypes {
        debug {
            manifestPlaceholders = [appLabel: '拾流测试版']
            // Side-by-side preview builds can use an isolated update channel and a caller-provided test key.
            if (previewInstall) {
                applicationIdSuffix '.preview'
                if (previewVersionName == null) versionNameSuffix '-preview'
                if (previewKeystore != null) signingConfig signingConfigs.preview
            }
        }
        release { minifyEnabled false; debuggable false }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

// Keep test-only SDK artifact downloads on the active runtime's proxy and CA.
// Values come from the build invocation; no machine-specific port is stored.
tasks.withType(Test).configureEach {
    ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
     'javax.net.ssl.trustStore', 'javax.net.ssl.trustStorePassword'].each { key ->
        def value = System.getProperty(key)
        if (value != null) systemProperty key, value
    }
}
