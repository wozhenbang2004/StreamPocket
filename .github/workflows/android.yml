name: Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check and build APK
        run: gradle --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload UI fixtures and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-verification
          path: |
            app/build/reports/view-fixtures/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 7
      - name: Collect Android signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp -r "$ANDROID_HOME/build-tools/35.0.0/lib64" signing-tools/
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-signing-tools
          path: signing-tools/
          retention-days: 7
