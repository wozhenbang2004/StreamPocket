name: Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check update recovery and process stopping
        run: |
          mkdir -p "$RUNNER_TEMP/streampocket-reliability"
          javac -Xlint:all -d "$RUNNER_TEMP/streampocket-reliability" \
            app/src/main/java/dev/streampocket/CoreUpdate.java \
            app/src/main/java/dev/streampocket/DownloadProcessStopper.java \
            app/src/test/java/dev/streampocket/CoreUpdateSelfTest.java \
            app/src/test/java/dev/streampocket/DownloadProcessStopperSelfTest.java
          java -cp "$RUNNER_TEMP/streampocket-reliability" dev.streampocket.CoreUpdateSelfTest
          java -cp "$RUNNER_TEMP/streampocket-reliability" dev.streampocket.DownloadProcessStopperSelfTest
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check and build APK
        run: gradle --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Build side-by-side preview
        run: gradle --no-daemon --console=plain -PpreviewInstall=true assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload UI fixtures and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-verification
          path: |
            app/build/reports/view-fixtures/
            app/build/ui-render/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 7
      - name: Collect Android signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp -r "$ANDROID_HOME/build-tools/35.0.0/lib64" signing-tools/
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-signing-tools
          path: signing-tools/
          retention-days: 7

  playback-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build isolated emulator APKs
        run: gradle --no-daemon --console=plain -I tools/qa-x86.init.gradle assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play real media and exercise picture-in-picture
        # Android Emulator Runner v2, Apache-2.0; pin the reviewed action revision.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          disable-animations: false
          script: bash tools/run-emulator-acceptance.sh
      - name: Upload emulator playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-emulator-playback
          path: app/build/reports/emulator-acceptance/
          retention-days: 7
