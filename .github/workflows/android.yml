name: UI verification 0.4.1
on:
  workflow_dispatch:
  push:
    branches: [uiux/verify-041-20261102]

permissions:
  contents: read

jobs:
  ui-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source identity
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git ls-tree -r HEAD -- app/src app/build.gradle build.gradle settings.gradle gradle.properties .github/workflows/android.yml > verification/source-tree.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify UI contracts and render fixtures
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ui-verification.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach {
                  maxHeapSize = '2g'
                  maxParallelForks = 1
              }
          }
          GRADLE
          set -o pipefail
          gradle --no-daemon --console=plain --max-workers=2 --init-script "$RUNNER_TEMP/ui-verification.gradle" :app:testDebugUnitTest --tests dev.streampocket.UiRefinementTest --tests dev.streampocket.WhiteUiRenderTest --tests dev.streampocket.MediaWorkspaceUiTest 2>&1 | tee verification/gradle.log
      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreamPocket-ui-verification-${{ github.sha }}
          path: |
            verification/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/ui-render/
            build/ui-render/
            docs/design/assets/022-regression/
          if-no-files-found: warn
          retention-days: 7
